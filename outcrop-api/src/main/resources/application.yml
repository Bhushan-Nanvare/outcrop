spring:
  application:
    name: outcrop-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/outcrop
    username: ${OUTCROP_DB_USER:postgres}
    password: ${OUTCROP_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

outcrop:
  version: @project.version@
  clone:
    workspace: ${java.io.tmpdir}/outcrop
    max-java-files: 5000
    max-size-mb: 250
    timeout-seconds: 120
